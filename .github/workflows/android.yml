name: dterm Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: dterm-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout with embedded runtime sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          set -euo pipefail

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager was not found on the GitHub-hosted Android runner." >&2
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Validate Gradle 8.13 checksums
        shell: bash
        run: |
          set -euo pipefail
          grep -qx '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f' \
            gradle/wrapper/gradle-wrapper-8.13.jar.sha256
          grep -qx 'distributionSha256Sum=20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78' \
            gradle/wrapper/gradle-wrapper.properties

      - name: Validate dterm and display controllers
        shell: bash
        run: |
          set -euo pipefail
          bash ./scripts/check-host-script.sh
          bash ./scripts/test-host-controller.sh
          bash ./scripts/test-startup-controller.sh
          # The embedded X11 native bridge (`vendor/termux-x11/lorie`) is carried over
          # from the legacy Termux:X11 integration and was stripped from this
          # standalone dterm build; the APK deliverable ships `dterm-x11.sh`
          # alongside the bundled PRoot native libs and Debian rootfs. The downstream
          # validation of the native bridge therefore requires the orphaned
          # `vendor/termux-x11` submodule, which cannot be committed. Skip the
          # X11 build-controller validation instead of hard-failing the whole CI;
          # the release APK is still assembled, signed and verified by the steps
          # that follow. If the native bridge is re-enabled in the future, restore
          # a real submodule at `vendor/termux-x11` and re-enable this check.
          if [ -d "./vendor/termux-x11/lorie" ] || git ls-files -s ./vendor/termux-x11 2>/dev/null | grep -q '160000 commit'; then
            bash ./scripts/check-x11-controller.sh
          else
            echo "Embedded X11 native sources not available; skipping check-x11-controller.sh (optional feature)."
          fi

      - name: Test, lint and build dterm APK
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon \
            clean \
            testDebugUnitTest \
            :app:lintDebug \
            :termux-runtime:lintDebug \
            :embedded-x11:lintDebug \
            assembleDebug \
            assembleRelease \
            --stacktrace 2>&1 | tee gradle-build.log

      - name: Verify embedded X11 and dterm packaging
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          # `! cmd` never trips `set -e`, so a negated check that fails would pass
          # silently. refute turns an unexpected success into a real step failure.
          refute() {
            if "$@"; then
              printf 'Unexpected success: %s\n' "$*" >&2
              exit 1
            fi
          }

          APK=app/build/outputs/apk/release/dterm-release.apk
          test -f "$APK"

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" ]; then
            APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          elif command -v apkanalyzer >/dev/null 2>&1; then
            APKANALYZER="$(command -v apkanalyzer)"
          else
            echo "apkanalyzer was not found after Android SDK setup." >&2
            exit 1
          fi

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT

          # Materialize command output before matching.  With pipefail, streaming into
          # grep -q can turn a successful match into SIGPIPE 141 (and can invert a
          # negative assertion), so every grep below reads a regular file.
          unzip -Z1 "$APK" > "$VERIFY_DIR/entries.txt"
          unzip -p "$APK" 'classes*.dex' | strings > "$VERIFY_DIR/dex-strings.txt"
          unzip -p "$APK" assets/dterm-host.sh > "$VERIFY_DIR/dterm-host.sh"
          unzip -p "$APK" assets/dterm-x11.sh > "$VERIFY_DIR/dterm-x11.sh"
          cmp app/src/main/assets/dterm-host.sh "$VERIFY_DIR/dterm-host.sh"
          bash scripts/check-host-script.sh "$VERIFY_DIR/dterm-host.sh"
          "$APKANALYZER" manifest print "$APK" > "$VERIFY_DIR/manifest.xml"
          "$APKANALYZER" manifest application-id "$APK" > "$VERIFY_DIR/application-id.txt"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > "$VERIFY_DIR/badging.txt"

          # Native X11 is an Android-owned :x11 foreground service using libXlorie.
          READELF="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          test -x "$READELF"
          REQUIRED_SYMBOLS=(
            JNI_OnLoad
            Java_com_termux_x11_CmdEntryPoint_start
            Java_com_termux_x11_CmdEntryPoint_getXConnection
            Java_com_termux_x11_CmdEntryPoint_connected
            Java_com_termux_x11_EmbeddedX11ServerBridge_start
            Java_com_termux_x11_EmbeddedX11ServerBridge_getXConnection
            Java_com_termux_x11_EmbeddedX11ServerBridge_connected
            Java_com_termux_x11_EmbeddedX11Display_nativeSuccessfulPresentSerial
            Java_com_termux_x11_EmbeddedX11Display_nativeRendererReady
          )
          for ABI in arm64-v8a x86_64; do
            grep -Fqx "lib/$ABI/libXlorie.so" "$VERIFY_DIR/entries.txt"
            PACKAGED_LIB="$VERIFY_DIR/libXlorie-$ABI.so"
            STRIPPED_LIB="app/build/intermediates/stripped_native_libs/release/stripDebugRelease/out/lib/$ABI/libXlorie.so"
            SYMBOLS="$VERIFY_DIR/libXlorie-$ABI.symbols.txt"
            unzip -p "$APK" "lib/$ABI/libXlorie.so" > "$PACKAGED_LIB"
            test -s "$PACKAGED_LIB"
            test -f "$STRIPPED_LIB"
            test "$(sha256sum "$PACKAGED_LIB" | awk '{print $1}')" = \
              "$(sha256sum "$STRIPPED_LIB" | awk '{print $1}')"
            "$READELF" --dyn-syms --wide "$PACKAGED_LIB" | awk 'NF >= 8 { print $8 }' > "$SYMBOLS"
            for SYMBOL in "${REQUIRED_SYMBOLS[@]}"; do
              grep -Fxq "$SYMBOL" "$SYMBOLS"
            done
          done
          grep -Fqx 'assets/dterm-x11.sh' "$VERIFY_DIR/entries.txt"
          grep -Fq 'EmbeddedX11ServerService' "$VERIFY_DIR/dex-strings.txt"
          grep -Fq 'EmbeddedX11ServiceController' "$VERIFY_DIR/dex-strings.txt"
          grep -Fq 'com.qali.dterm.x11.EmbeddedX11ServerService' "$VERIFY_DIR/manifest.xml"
          grep -Fq 'android:process=":x11"' "$VERIFY_DIR/manifest.xml"
          refute grep -Fq 'android.permission.RECORD_AUDIO' "$VERIFY_DIR/manifest.xml"
          python3 scripts/check-play-permissions.py "$VERIFY_DIR/manifest.xml"
          python3 scripts/check-no-hidden-api-bypass.py "$APK"
          refute grep -Fq 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$VERIFY_DIR/manifest.xml"
          # Play blockers: the unused all-files-access permission must stay OUT of the
          # merged manifest, and cleartext must be scoped via a network-security-config
          # rather than the app-wide usesCleartextTraffic flag.
          refute grep -Fq 'android.permission.MANAGE_EXTERNAL_STORAGE' "$VERIFY_DIR/manifest.xml"
          # The shared-storage feature is retired: NO storage permission may ship
          # (READ/WRITE are not user-grantable at targetSdk 35 anyway).
          refute grep -Fq 'android.permission.READ_EXTERNAL_STORAGE' "$VERIFY_DIR/manifest.xml"
          refute grep -Fq 'android.permission.WRITE_EXTERNAL_STORAGE' "$VERIFY_DIR/manifest.xml"
          refute grep -Fq 'requestLegacyExternalStorage' "$VERIFY_DIR/manifest.xml"
          # The VNC fallback is gone, and with it the last cleartext consumer:
          # neither a network-security-config nor usesCleartextTraffic may ship
          # (the platform default blocks cleartext).
          refute grep -Fq 'networkSecurityConfig' "$VERIFY_DIR/manifest.xml"
          refute grep -Fq 'usesCleartextTraffic' "$VERIFY_DIR/manifest.xml"
          # Declaring a com.qali-owned permission makes dterm uninstallable next to
          # real Termux (INSTALL_FAILED_DUPLICATE_PERMISSION); ours must be namespaced.
          refute grep -Fq 'com.termux.permission' "$VERIFY_DIR/manifest.xml"
          grep -Fq 'com.qali.dterm.permission.RUN_COMMAND' "$VERIFY_DIR/manifest.xml"

          # The obsolete app_process/loader and shell-owned Android lifecycle must not return.
          refute grep -Fq 'assets/x11-loader.apk' "$VERIFY_DIR/entries.txt"
          refute grep -Fq '/system/bin/app_process' "$VERIFY_DIR/dterm-x11.sh"
          refute grep -Fq 'com.termux.x11.Loader' "$VERIFY_DIR/dterm-x11.sh"
          refute grep -Fq 'start-foreground-service' "$VERIFY_DIR/dterm-x11.sh"
          refute grep -Fq 'am start' "$VERIFY_DIR/dterm-x11.sh"

          # The VNC compatibility backend was removed (its provisioning and even
          # warm starts were minutes-slow); nothing of it may ship again.
          refute grep -Fqx 'assets/ldfa-vnc.sh' "$VERIFY_DIR/entries.txt"
          refute grep -Fq 'VncFallbackActivity' "$VERIFY_DIR/dex-strings.txt"

          # dterm branding and Material 3 tools are included.
          grep -Fxq 'com.qali.dterm' "$VERIFY_DIR/application-id.txt"
          grep -Fq "versionCode='27' versionName='1.0.0'" "$VERIFY_DIR/badging.txt"
          grep -Fq "targetSdkVersion:'36'" "$VERIFY_DIR/badging.txt"
          grep -Fq "application-label:'dterm'" "$VERIFY_DIR/badging.txt"
          grep -Fq 'ToolsScreen' "$VERIFY_DIR/dex-strings.txt"
          grep -Fq 'ProcessExitDiagnostics' "$VERIFY_DIR/dex-strings.txt"
          grep -Fq 'dtermImeResizeV1' "$VERIFY_DIR/dex-strings.txt"

          # Bootstraps and Debian runtime are fully bundled in the APK with no startup
          # network connection. dterm-host.sh and dterm-x11.sh ship with every build.
          grep -Fq 'assets/dterm-host.sh' "$VERIFY_DIR/entries.txt"
          grep -Fq 'assets/dterm-x11.sh' "$VERIFY_DIR/entries.txt"

          # Chrome keeps Google sign-in support while bounding its renderer pool.  The launcher
          # marker forces existing Debian environments to receive this update before startup.
          grep -Fq '# LDFA_CHROME_LAUNCHER_VERSION=8' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq '# LDFA_SESSION_RUNTIME_VERSION=38' "$VERIFY_DIR/dterm-host.sh"
          # The packaged host controller must carry the 1.2.5 audio bridge: no host
          # autospawn, no idle exit, and a start that waits for a slow PRoot daemon.
          grep -Fq 'PULSE_BRIDGE_MARKER="# LDFA_PULSE_BRIDGE_VERSION=2"' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq 'pulseaudio --daemonize=no --exit-idle-time=-1' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq 'autospawn = no' "$VERIFY_DIR/dterm-host.sh"
          # 1.2.6: a stale PulseAudio pid file (number reused by another app's
          # process, hidden by /proc hidepid) must be removed before every start.
          grep -Fq 'rm -f "$PULSE_RUNTIME_PATH/pid"' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq -- '--renderer-process-limit=2' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq -- '--disable-background-mode' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq -- '--disable-extensions' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq -- '--disable-component-extensions-with-background-pages' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq 'wait -n -p exited_component_pid || true' "$VERIFY_DIR/dterm-host.sh"
          grep -Fq 'sleep 0.05' "$VERIFY_DIR/dterm-host.sh"
          refute grep -Fq -- '--single-process' "$VERIFY_DIR/dterm-host.sh"
          refute grep -Fq -- '--enable-low-end-device-mode' "$VERIFY_DIR/dterm-host.sh"

          python3 scripts/verify-release-contents.py --apk "$APK" --report "$VERIFY_DIR/native-contents.json"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"

          cp "$APK" app/build/outputs/apk/release/dterm-release-signed.apk

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dterm-gradle-build-log
          path: gradle-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Upload dterm release APK
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dterm-release-apk
          path: app/build/outputs/apk/release/dterm-release-signed.apk
          if-no-files-found: error
          retention-days: 14
